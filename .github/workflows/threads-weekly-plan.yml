name: Threads Weekly Plan (24 drafts)

# 매주 월요일 KST 06:00 = UTC 일요일 21:00.
# GHA cron은 best-effort ~1~2h 지연이므로 일요일 19:15 UTC에 트리거 →
# 실제 ~21:00 UTC ~= KST 월요일 06:00.
#
# 24번 직렬 호출 (각 1편 생성, Vercel 60초 한도 회피). 8일=월~다음주 월.
on:
  schedule:
    - cron: "15 19 * * 0"
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유 (선택)"
        required: false
        default: "manual"

concurrency:
  group: threads-weekly-plan
  cancel-in-progress: false

jobs:
  generate:
    name: Generate 24 weekly drafts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 환경 검증
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "${PRODUCTION_URL}" ] || { echo "::error::PRODUCTION_URL 미설정"; exit 1; }
          [ -n "${CRON_SECRET}" ] || { echo "::error::CRON_SECRET 미설정"; exit 1; }
          echo "✓ Secrets OK"

      - name: 24편 직렬 생성
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          call_index() {
            local i=$1
            local response http_status body kw sched
            response=$(curl -sS \
              -w "\nHTTP_STATUS:%{http_code}\n" \
              -X POST "${PRODUCTION_URL}/api/cron/threads-weekly-plan" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"index\": $i}" \
              --max-time 90 \
              --retry 1)
            http_status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2 | tr -d ' ')
            body=$(echo "$response" | sed '/HTTP_STATUS:/d')
            if [ "$http_status" = "200" ]; then
              kw=$(echo "$body" | jq -r '.keyword // "?"')
              sched=$(echo "$body" | jq -r '.scheduled_at // "?"')
              echo "✓ $i: $kw → $sched"
              return 0
            fi
            echo "::warning::index $i 실패 (HTTP $http_status)"
            echo "$body" | head -5
            return 1
          }

          total=0
          failed=""
          for i in $(seq 0 23); do
            echo "▶ [$i/23] 생성 요청"
            if call_index "$i"; then total=$((total + 1)); else failed="$failed $i"; fi
            sleep 2
          done

          # 실패 index 재시도 패스 — 일시 오류(시트 읽기 실패·Gemini 빈손)는
          # 한 번 더 부르면 대부분 성공. 빈 슬롯이 그대로 발행 주간에 남는 것 방지.
          if [ -n "$failed" ]; then
            echo "🔁 실패 index 재시도:$failed"
            sleep 15
            still=""
            for i in $failed; do
              echo "▶ [retry $i] 생성 요청"
              if call_index "$i"; then total=$((total + 1)); else still="$still $i"; fi
              sleep 2
            done
            failed="$still"
          fi

          fail=$(echo "$failed" | wc -w | tr -d ' ')
          echo "PLAN_TOTAL=$total" >> "$GITHUB_ENV"
          echo "PLAN_FAIL=$fail" >> "$GITHUB_ENV"
          echo "PLAN_FAILED_IDX=${failed# }" >> "$GITHUB_ENV"

          {
            echo "## 🧵 Threads Weekly Plan"
            echo ""
            echo "**성공:** $total / 24"
            echo "**실패:** $fail${failed:+ (index${failed})}"
            echo ""
            echo "👉 검토: ${PRODUCTION_URL}/threads"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 실패 시 텔레그램 알림
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          fail="${PLAN_FAIL:-24}"
          total="${PLAN_TOTAL:-0}"
          if [ "$JOB_STATUS" != "success" ] || [ "$fail" -gt 0 ]; then
            msg=$(printf '⚠️ Threads 주간 초안 생성 이상\n· 성공 %s / 24, 실패 %s (index %s)\n· 빈 슬롯은 주간 일정에 "초안 없음"으로 남음\n조치: gh workflow run threads-weekly-plan.yml 재실행' \
              "$total" "$fail" "${PLAN_FAILED_IDX:-?}")
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" --data-urlencode "text=${msg}" >/dev/null || true
          fi
