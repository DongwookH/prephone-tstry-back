name: Generate Daily Posts

# 매일 KST 09:00 부근 발행을 목표로 cron 설정.
#
# GitHub Actions cron은 best-effort라 매일 ~1시간 45분 지연됨 (관측치).
# 따라서 KST 07:15 설정(UTC 22:15) → KST 09:00 부근 실제 트리거 → 생성 완료.
# 비정시(분 단위)로 잡아 정시 부하 회피.
#
# 관측 데이터 (이전 cron `45 23 * * *` UTC):
#   5/19 → 01:32 UTC (KST 10:32) — 1h 47m 지연
#   5/20 → 01:34 UTC (KST 10:34) — 1h 49m 지연
#   5/21 → 01:33 UTC (KST 10:33) — 1h 48m 지연
#
# ⚠️ 이관 노트: 글 생성 1개가 30~50초라 Vercel Hobby 60초 벽에 걸려 504가 대량 발생했다.
#    → 생성 자체를 GHA 러너에서 실행(scripts/generate-daily.ts)하고 시트 저장까지 러너에서 직접 수행.
#      Vercel은 계획 조회(plan) 등 가벼운 API만 담당. GHA 러너는 실행 시간 제한이 없다.
on:
  # ⚠️ 2026-08-18 중단 — v2 백오피스(prephone-tstry-back-v2)로 이관 완료.
  # 사장님 지시로 구 시스템 정기 실행을 전부 끔. 수동 실행(workflow_dispatch)은
  # 되돌릴 일에 대비해 남겨둔다. 되살리려면 아래 schedule 블록의 주석을 풀면 된다.
  # schedule:
    # - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유 (선택)"
        required: false
        default: "manual trigger"

# 동시 실행 방지
concurrency:
  group: generate-posts
  cancel-in-progress: false

jobs:
  # ─── 1단계: 러너에서 글 생성 + 시트 저장 (Plan+매트릭스+fill-missing 대체) ───
  #   scripts/generate-daily.ts 가 plan 조회 → 누락 계산 → lib 함수 직접 호출로 생성·저장.
  #   Vercel 60초 벽 없음 (러너는 실행 시간 제한 없음, timeout-minutes로만 제한).
  generate:
    name: Generate (러너 직접 생성)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: 글 생성 + 시트 저장
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          # 키워드 사용량(bumpKeywordsUsage)은 별도 시트 — 누락 시 메인 시트에 잘못 기록됨
          KEYWORDS_SHEET_ID: ${{ secrets.KEYWORDS_SHEET_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          # 스크립트 로그 전체를 파일로도 남겨서 요약 JSON 라인을 추출.
          npx --yes tsx scripts/generate-daily.ts 2>&1 | tee /tmp/gen.log
          # tsx의 exit code 보존 (tee 뒤라서 PIPESTATUS 사용)
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 요약 정리 ($GITHUB_STEP_SUMMARY)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          # 스크립트가 마지막에 출력한 요약 JSON 한 줄 추출
          # (형태: {"total":10,"saved":9,"alreadySaved":0,"failed":["키워드"]})
          summary_line=$(grep -oE '\{"total":[0-9]+.*\}' /tmp/gen.log | tail -n1 || true)

          {
            echo "## 🚀 Tistory Auto — Daily Generation (러너 직접 생성)"
            echo ""
            echo "**실행 시간:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**트리거:** \`${{ github.event_name }}\`"
            echo ""
            if [ -n "$summary_line" ]; then
              total=$(echo "$summary_line" | jq -r '.total // "?"')
              saved=$(echo "$summary_line" | jq -r '.saved // "?"')
              already=$(echo "$summary_line" | jq -r '.alreadySaved // 0')
              failed_count=$(echo "$summary_line" | jq -r '(.failed // []) | length')
              echo "| 항목 | 값 |"
              echo "| --- | --- |"
              echo "| 계획(total) | ${total} |"
              echo "| 새로 저장(saved) | ${saved} |"
              echo "| 기존 저장(alreadySaved) | ${already} |"
              echo "| 실패(failed) | ${failed_count} |"
              echo ""
              failed_list=$(echo "$summary_line" | jq -r '(.failed // []) | .[]' 2>/dev/null || true)
              if [ -n "$failed_list" ]; then
                echo "**실패 키워드:**"
                echo "$failed_list" | while read -r kw; do echo "- ❌ $kw"; done
              fi
            else
              echo "⚠️ 요약 JSON을 로그에서 찾지 못했습니다. 스텝 로그를 확인하세요."
            fi
            echo ""
            echo "👉 https://prephone-tstry-back.vercel.app/posts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 최종 exit code 반영
        if: ${{ !cancelled() }}
        run: |
          # 스크립트가 일부 항목 실패로 exit 1이면 job도 실패로 표시 (썸네일 잡은 !cancelled로 계속).
          code="${{ steps.gen.outputs.exit_code }}"
          echo "generate-daily.ts exit code: ${code:-unknown}"
          [ "${code:-0}" = "0" ] || exit 1

  # ─── 2단계: 썸네일 자동 생성 + 커밋 (새 카드 시스템: NVIDIA 배경 + PIL 오버레이) ───
  thumbnails:
    name: Thumbnails + 카드뉴스 (NVIDIA)
    # generate 잡이 끝난 뒤 실행 → 생성된 글의 썸네일 + 카드뉴스 생성.
    needs: [generate]
    # generate 일부가 실패해도 실행(성공 글 이미지 보존).
    # !cancelled(): 워크플로 취소가 아닌 한 진행.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # NVIDIA 엔드포인트 지연 시 순차 생성이 밀리므로 여유를 둠(30→45).
    # 스크립트가 타임아웃·5xx는 fail-fast로 즉시 넘어가고, 못 채운 이미지는
    # backfill-images.yml 크론이 몇 시간 뒤 --skip-existing으로 보충한다.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Python + Pillow
        run: pip install --quiet Pillow

      - name: 노토산스 KR 폰트 다운로드
        run: |
          curl -sL "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" -o /tmp/NotoSansKR.ttf
          ls -la /tmp/NotoSansKR.ttf

      - name: 오늘 글 썸네일 생성 (NVIDIA 배경 + 카드 오버레이)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          # card-image.py가 NOTO_FONT로 한글 가변폰트 사용 (Linux엔 시스템 한글폰트 없음)
          NOTO_FONT: /tmp/NotoSansKR.ttf
        run: |
          set -uo pipefail
          npx --yes tsx scripts/regen-thumbnails.mjs 2>&1 | tee /tmp/thumbs.log
          echo "--- 요약 ---"; tail -n1 /tmp/thumbs.log

      - name: 오늘 글 카드뉴스 생성 (섹션 인포카드, 글당 최대 3장)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          NOTO_FONT: /tmp/NotoSansKR.ttf
        run: |
          set -uo pipefail
          npx --yes tsx scripts/regen-cardnews.mjs --max-cards 4 2>&1 | tee /tmp/cardnews.log
          echo "--- 요약 ---"; tail -n1 /tmp/cardnews.log

      - name: 생성된 썸네일·카드뉴스 커밋·push
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain public/thumbnails public/card-news)" ]; then
            echo "변경된 이미지 없음"; exit 0
          fi
          git add public/thumbnails public/card-news
          git commit -m "chore(images): 자동 생성 썸네일·카드뉴스 [skip ci]"
          git push

      - name: 실패 시 텔레그램 알림
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          thumbs=$(tail -n1 /tmp/thumbs.log 2>/dev/null || echo '{}')
          cards=$(tail -n1 /tmp/cardnews.log 2>/dev/null || echo '{}')
          msg=$(node scripts/build-image-alert.mjs "$JOB_STATUS" "$thumbs" "$cards" "메인(썸네일 잡)" "백필(00:30·04:00 UTC)이 자동 재시도합니다.")
          if [ -n "$msg" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" --data-urlencode "text=${msg}" >/dev/null || true
          fi
