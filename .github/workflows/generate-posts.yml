name: Generate Daily Posts

# 매일 KST 09:00 부근 발행을 목표로 cron 설정.
#
# GitHub Actions cron은 best-effort라 매일 ~1시간 45분 지연됨 (관측치).
# 따라서 KST 07:15 설정(UTC 22:15) → KST 09:00 부근 실제 트리거 → 생성 완료.
# 비정시(분 단위)로 잡아 정시 부하 회피.
#
# 관측 데이터 (이전 cron `45 23 * * *` UTC):
#   5/19 → 01:32 UTC (KST 10:32) — 1h 47m 지연
#   5/20 → 01:34 UTC (KST 10:34) — 1h 49m 지연
#   5/21 → 01:33 UTC (KST 10:33) — 1h 48m 지연
#
# ⚠️ 이관 노트: 글 생성 1개가 30~50초라 Vercel Hobby 60초 벽에 걸려 504가 대량 발생했다.
#    → 생성 자체를 GHA 러너에서 실행(scripts/generate-daily.ts)하고 시트 저장까지 러너에서 직접 수행.
#      Vercel은 계획 조회(plan) 등 가벼운 API만 담당. GHA 러너는 실행 시간 제한이 없다.
on:
  schedule:
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 실행 사유 (선택)"
        required: false
        default: "manual trigger"

# 동시 실행 방지
concurrency:
  group: generate-posts
  cancel-in-progress: false

jobs:
  # ─── 1단계: 러너에서 글 생성 + 시트 저장 (Plan+매트릭스+fill-missing 대체) ───
  #   scripts/generate-daily.ts 가 plan 조회 → 누락 계산 → lib 함수 직접 호출로 생성·저장.
  #   Vercel 60초 벽 없음 (러너는 실행 시간 제한 없음, timeout-minutes로만 제한).
  generate:
    name: Generate (러너 직접 생성)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: 글 생성 + 시트 저장
        id: gen
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          # 키워드 사용량(bumpKeywordsUsage)은 별도 시트 — 누락 시 메인 시트에 잘못 기록됨
          KEYWORDS_SHEET_ID: ${{ secrets.KEYWORDS_SHEET_ID }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          # 스크립트 로그 전체를 파일로도 남겨서 요약 JSON 라인을 추출.
          npx --yes tsx scripts/generate-daily.ts 2>&1 | tee /tmp/gen.log
          # tsx의 exit code 보존 (tee 뒤라서 PIPESTATUS 사용)
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 요약 정리 ($GITHUB_STEP_SUMMARY)
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          # 스크립트가 마지막에 출력한 요약 JSON 한 줄 추출
          # (형태: {"total":10,"saved":9,"alreadySaved":0,"failed":["키워드"]})
          summary_line=$(grep -oE '\{"total":[0-9]+.*\}' /tmp/gen.log | tail -n1 || true)

          {
            echo "## 🚀 Tistory Auto — Daily Generation (러너 직접 생성)"
            echo ""
            echo "**실행 시간:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "**트리거:** \`${{ github.event_name }}\`"
            echo ""
            if [ -n "$summary_line" ]; then
              total=$(echo "$summary_line" | jq -r '.total // "?"')
              saved=$(echo "$summary_line" | jq -r '.saved // "?"')
              already=$(echo "$summary_line" | jq -r '.alreadySaved // 0')
              failed_count=$(echo "$summary_line" | jq -r '(.failed // []) | length')
              echo "| 항목 | 값 |"
              echo "| --- | --- |"
              echo "| 계획(total) | ${total} |"
              echo "| 새로 저장(saved) | ${saved} |"
              echo "| 기존 저장(alreadySaved) | ${already} |"
              echo "| 실패(failed) | ${failed_count} |"
              echo ""
              failed_list=$(echo "$summary_line" | jq -r '(.failed // []) | .[]' 2>/dev/null || true)
              if [ -n "$failed_list" ]; then
                echo "**실패 키워드:**"
                echo "$failed_list" | while read -r kw; do echo "- ❌ $kw"; done
              fi
            else
              echo "⚠️ 요약 JSON을 로그에서 찾지 못했습니다. 스텝 로그를 확인하세요."
            fi
            echo ""
            echo "👉 https://prephone-tstry-back.vercel.app/posts"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 최종 exit code 반영
        if: ${{ !cancelled() }}
        run: |
          # 스크립트가 일부 항목 실패로 exit 1이면 job도 실패로 표시 (썸네일 잡은 !cancelled로 계속).
          code="${{ steps.gen.outputs.exit_code }}"
          echo "generate-daily.ts exit code: ${code:-unknown}"
          [ "${code:-0}" = "0" ] || exit 1

  # ─── 2단계: 썸네일 자동 생성 + 커밋 ─────────────────
  thumbnails:
    name: Thumbnails (Pillow)
    # generate 잡이 끝난 뒤 실행 → 생성된 글의 썸네일 생성.
    needs: [generate]
    # generate 일부가 실패해도 thumbnails는 실행(성공 글 썸네일 보존).
    # !cancelled(): 워크플로 취소가 아닌 한 진행.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Python + Pillow
        run: pip install --quiet Pillow

      - name: 노토산스 KR 폰트 다운로드
        run: |
          curl -sL "https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf" -o /tmp/NotoSansKR.ttf
          ls -la /tmp/NotoSansKR.ttf

      - name: 오늘 글 메타 조회 + 썸네일 생성
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          posts=$(curl -sS -X GET "${PRODUCTION_URL}/api/cron/posts-today" \
            -H "Authorization: Bearer ${CRON_SECRET}" --max-time 60)
          count=$(echo "$posts" | jq '.count // 0')
          echo "오늘 썸네일 대상: $count 개"
          if [ "$count" = "0" ]; then echo "대상 없음 — 종료"; exit 0; fi
          echo "$posts" | jq -c '.posts' \
            | NOTO_FONT=/tmp/NotoSansKR.ttf OUT_DIR=public/thumbnails ASSET_DIR=scripts/assets \
              python3 scripts/thumbnail.py

      - name: 생성된 썸네일 커밋·push
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain public/thumbnails)" ]; then
            echo "변경된 썸네일 없음"; exit 0
          fi
          git add public/thumbnails
          git commit -m "chore(thumbnail): 자동 생성 썸네일 [skip ci]"
          git push
