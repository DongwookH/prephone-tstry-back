name: Generate Tenant Posts

# 멀티테넌트 글 생성 — 활성 멤버 테넌트를 순회하며 각자 전용 시트에 생성.
# 오너 파이프라인(generate-posts.yml)과 분리: 오너 실패/테넌트 실패가 서로 안 번짐.
#
# KST 09:30 부근 목표 (GHA cron 지연 ~1h45m 관측 반영: UTC 22:45 설정).
#
# ⚠️ GEMINI_API_KEYS를 일부러 주입하지 않는다 — 테넌트는 반드시 본인 시트
#    settings 탭의 키만 사용해야 하며, 키 없는 테넌트는 스크립트가 스킵한다.
on:
  schedule:
    - cron: "45 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry-run (진단만, 생성 안 함)"
        required: false
        default: "false"

concurrency:
  group: generate-tenant-posts
  cancel-in-progress: false

jobs:
  generate:
    name: Generate (테넌트 순회)
    runs-on: ubuntu-latest
    # 편당 생성 ~1분 + 썸네일 1장·카드 4장. TENANT_DAILY_COUNT를 올릴 때
    # 여기도 같이 올린다 — 20편이면 글 ~23분 + 이미지 ~15분이라 50분은 빠듯하다.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci

      - name: 테넌트 글 생성 + 시트 저장
        env:
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          TENANT_DAILY_COUNT: ${{ vars.TENANT_DAILY_COUNT || '3' }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx --yes tsx scripts/generate-tenants.ts --dry-run
          else
            npx --yes tsx scripts/generate-tenants.ts
          fi

      # ── 이미지 (테넌트별 본인 NVIDIA 키 사용) ────────────────────────
      # ⚠️ NVIDIA_API_KEY를 job env로 주입하지 않는다 — 주입하면 오너 키가
      #    자식 프로세스에 새어들어 테넌트 이미지가 오너 할당량으로 나간다.
      #    generate-tenant-images.ts가 테넌트 settings 탭에서 각자 키를 읽는다.
      - name: 한글 폰트 준비
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          curl -sL -o /tmp/NotoSansKR.ttf \
            https://github.com/google/fonts/raw/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf
          ls -la /tmp/NotoSansKR.ttf

      - name: Pillow 설치
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: pip install --quiet Pillow

      - name: 테넌트 썸네일·카드뉴스 생성
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          NOTO_FONT: /tmp/NotoSansKR.ttf
        run: |
          set -uo pipefail
          npx --yes tsx scripts/generate-tenant-images.ts 2>&1 | tee /tmp/tenant-images.log
          echo "--- 요약 ---"; tail -n1 /tmp/tenant-images.log

      - name: 생성된 이미지 커밋·push
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain public/thumbnails public/card-news)" ]; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git add public/thumbnails public/card-news
          git commit -m "chore(images): 테넌트 썸네일·카드뉴스 자동 생성 [skip ci]"
          git pull --rebase --autostash origin main || true
          git push origin main
